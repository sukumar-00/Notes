services:
  web:
    image: ubuntu/apache2
    container_name: cont1
    ports:
      - "8080:80"
    volumes:
      - ./web1/index.html:/var/www/html/index.html

  web1:
    image: ubuntu/apache2
    container_name: cont2
    ports:
      - "8081:80"
    volumes:
      - ./web2/index.html:/var/www/html/index.html
